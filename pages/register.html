<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bankers Association</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-hero);
            padding: var(--spacing-lg);
        }

        .auth-card {
            background: var(--white);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
            margin: var(--spacing-lg) 0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .auth-header h1 {
            font-size: var(--font-size-3xl);
            margin-bottom: var(--spacing-sm);
        }

        .auth-header p {
            color: var(--gray-600);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: var(--font-weight-medium);
            color: var(--gray-700);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            transition: all var(--transition-fast);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 2px;
        }

        .form-checkbox label {
            color: var(--gray-600);
            cursor: pointer;
            font-size: var(--font-size-sm);
            line-height: 1.5;
        }

        .btn-full {
            width: 100%;
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--gray-600);
        }

        .auth-footer a {
            color: var(--primary-blue);
            font-weight: var(--font-weight-semibold);
        }

        .alert {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .password-strength {
            margin-top: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }

        .strength-weak {
            color: var(--accent-red);
        }

        .strength-medium {
            color: var(--secondary-gold);
        }

        .strength-strong {
            color: var(--accent-green);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="font-size: 3rem; margin-bottom: var(--spacing-sm);">🏦</div>
                <h1>Join Us Today</h1>
                <p>Create your account and start your journey</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" class="form-input"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="employeeId" class="form-label">Employee ID *</label>
                        <input type="text" id="employeeId" name="employeeId" class="form-input"
                            placeholder="e.g., SBI123456" required>
                    </div>

                    <div class="form-group">
                        <label for="designation" class="form-label">Designation *</label>
                        <select id="designation" name="designation" class="form-select" required>
                            <option value="">Select...</option>
                            <option value="clerk">Clerk</option>
                            <option value="officer">Officer</option>
                            <option value="assistant-manager">Assistant Manager</option>
                            <option value="manager">Manager</option>
                            <option value="senior-manager">Senior Manager</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Official Email Address *</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="your.email@sbi.co.in"
                        required>
                    <small style="color: var(--gray-500); font-size: var(--font-size-xs);">
                        Please use your official bank email for verification
                    </small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location" class="form-label">Current Location *</label>
                        <input type="text" id="location" name="location" class="form-input" placeholder="e.g., Mumbai"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="+91 XXXXXXXXXX">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Create a strong password" required>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                        placeholder="Re-enter your password" required>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" style="color: var(--primary-blue);">Terms of Service</a>
                        and <a href="#" style="color: var(--primary-blue);">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
                <p style="margin-top: var(--spacing-sm);"><a href="../index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', function (e) {
            const password = e.target.value;
            const strengthDiv = document.getElementById('passwordStrength');

            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            if (strength <= 1) {
                strengthDiv.textContent = 'Weak password';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength <= 3) {
                strengthDiv.textContent = 'Medium strength';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                strengthDiv.textContent = 'Strong password';
                strengthDiv.className = 'password-strength strength-strong';
            }
        });

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const alert = document.getElementById('alert');

            // Validation
            if (password !== confirmPassword) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Passwords do not match!';
                alert.style.display = 'block';
                return;
            }

            if (!terms) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Please accept the terms and conditions.';
                alert.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Password must be at least 8 characters long.';
                alert.style.display = 'block';
                return;
            }

            // Simulate successful registration
            alert.className = 'alert alert-success';
            alert.textContent = 'Account created successfully! Redirecting to login...';
            alert.style.display = 'block';

            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>

</html>
